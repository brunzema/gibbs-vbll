[project]
name = "gibbs-vbll"
version = "0.1.0"
description = "Gibbs variational last layers for long-horizon dynamics learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax==0.9.0",
    "flax==0.12.3",
    "optax==0.2.6",
    "numpy==2.1.3",
    "scipy==1.17.0",
    "matplotlib==3.10.8",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "omegaconf==2.3.0",
    "dtaidistance==2.3.13",
    "dysts==0.96",
    "wheelbot-dataset==0.1.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.9.0"]

[tool.uv]
package = false
