# Dysts continuous-flow environment configuration
#
# Select concrete system through config group:
#   python runs/train.py environment=dysts dysts_system=lorenz
# List available systems:
#   .venv/bin/python demo_dysts_flows_hydra.py --list-systems

name: dysts_${dysts_system.name}
normalize_states: true

environment:
  _target_: src.environments.dysts_environment.DystsFlowEnvironment
  system_name: ${dysts_system.system_name}
  dt: ${dysts_system.dt}
  noise_std: 0.01
  parameters: ${dysts_system.parameters}

# Initial-state bounds are system-specific and provided by dysts_system/*
initial_state_bounds: ${dysts_system.initial_state_bounds}

# ── Data / dataset settings ────────────────────────────────────────────────
data:
  trajectories:
    n_trajectories: 400
    traj_length: 120
    test_fraction: 0.0
    val_fraction: 0.2
    deterministic: false

  single_step:
    n_future: 1
    n_past: 1
    skip_n: 1

  multi_step:
    n_past: 1
    skip_n: 1
