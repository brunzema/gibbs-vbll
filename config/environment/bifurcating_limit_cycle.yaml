# Bifurcating Limit Cycle environment configuration
#
# A 2-D dynamical system with a limit cycle at radius R that exhibits
# angle-dependent pitchfork bifurcations. The radial dynamics include
# periodic bifurcation zones where the limit cycle splits into two branches:
#
#   dr/dt = μ(R - r) - α(θ)·(r - R) - κ(r - R)³
#   α(θ)  = α₀ sin²(n_bif·θ)
#
# When α(θ) > μ, the system bifurcates and the limit cycle splits.
# Angular motion is constant: dθ/dt = ω₀.
#
# See demo_bifurcation_limit_cycle_energy.py for usage details.
name: bifurcating_limit_cycle
normalize_states: false

environment:
  _target_: src.environments.BifurcatingLimitCycleEnv
  dt: 0.05
  noise_std: 0.03
  R: 1.0          # nominal limit cycle radius
  mu: 2.0         # base radial restoring strength
  kappa: 8.0      # cubic saturation for pitchfork bifurcation
  alpha_0: 5.0    # bifurcation modulation amplitude (must be > μ)
  n_bif: 2        # number of bifurcation zone pairs per revolution
  omega_0: 1.0    # constant angular velocity [rad/s]

# State space bounds for initial state sampling.
# Wide bounds ensure the model sees both on-cycle and transient dynamics.
initial_state_bounds:
  - [-2.0, 2.0]  # x1 bounds
  - [-2.0, 2.0]  # x2 bounds

# ── Data / dataset settings ────────────────────────────────────────────────
data:
  trajectories:
    n_trajectories: 300   
    traj_length: 50       
    test_fraction: 0.0
    val_fraction: 0.2   
    deterministic: false

  single_step:
    n_future: 1
    n_past: 1
    skip_n: 1

  multi_step:
    n_past: 1
    skip_n: 1              # dense windows; horizon comes from training config