# Multi-step KDE training configuration (VBLLDeltaModel)
#
# Maximises KDE log-likelihood with accumulated covariance:
#   L = -(1/H) Σ_h log[(1/S) Σ_s N(x*_h | x̂_h^(s), h·Σ_ν)] + λ·KL
#
# Samples stochastic rollouts to form a non-parametric mixture approximation
# of the predictive distribution per horizon step.
# Use with model=vbll_delta.
name: multi_step_kde

# General training parameters
n_epochs: 300
learning_rate: 1.0e-3
regularization_weight: 1.0  # Scaled by 1/n_train in runs/train.py
batch_size: 64
weight_decay: 1.0e-4
clip_grad_norm: 1.0
verbose: true
print_every: 10

# Device selection
device: cpu

# Multi-step specific parameters
multi_step:
  horizon: 40          # Prediction horizon H
  n_samples: 10        # S: stochastic rollout samples for KDE mixture
  n_val_samples: 100   # Samples for validation

  # Gamma tempering schedule
  gamma_schedule:
    type: constant
    gamma_init: 1.0
    gamma_final: 1.0
    k: 10.0
    transition_fraction: 0.67  # Fraction of training for gamma transition

# Logging
log_dir: logs

# Validation
val_every: 10
