name: vbll_delta

# Delta (residual) VBLL model: x_{t+1} = x_t + W^T φ(x_t) + ν
# Used by all training configs.
model:
  _target_: src.models.delta_vbll_model.VBLLDeltaModel
  input_dim: 2  # Overridden by environment state dimension
  output_dim: 2  # Overridden by environment state dimension
  hidden_dim: 64
  num_hidden_layers: 3
  feature_dim: 32
  activation_fn: mish
  prior_scale: 1.0
  wishart_scale: 0.1
